<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koin Arena - Game Simpel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">

    <!-- Header 4 Logo -->
    <div id="logo-header">
      <img src="logo1.jpeg" alt="Onesandvoscho" class="game-logo">
      <img src="logo2.jpeg" alt="SMKN 1 Sanden" class="game-logo">
      <img src="logo3.jpeg" alt="Moko Game Dev" class="game-logo">
      <img src="logo4.jpeg" alt="RPL" class="game-logo">
    </div>

    <!-- UI Panel Informasi Game -->
    <div id="ui-panel">
      <div>Level: <span id="level-txt">1</span></div>
      <div>Waktu: <span id="time-txt">30</span>s</div>
      <div>P1 Skor: <span id="p1-score">0</span></div>
      <div>P2/CPU: <span id="p2-score">0</span></div>
    </div>

    <!-- Canvas Game Utama -->
    <canvas id="gameCanvas" width="700" height="400"></canvas>

    <!-- Overlay Menu & Game Over -->
    <div id="overlay" class="overlay">
      <h1 id="menu-title">⚡ KOIN ARENA ⚡</h1>
      <p id="menu-subtitle">Kumpulkan koin sebanyak-banyaknya!</p>
      
      <div class="difficulty-group">
        <label for="difficulty-select">Mode Kesulitan:</label>
        <select id="difficulty-select">
          <option value="easy" selected>Mudah (Santai)</option>
          <option value="medium">Sedang (Normal)</option>
          <option value="hard">Sulit (Cepat)</option>
        </select>
      </div>

      <div class="btn-group">
        <button id="btn-single">🎮 1 Player (vs CPU)</button>
        <button id="btn-multi">👥 2 Players (Lokal)</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
